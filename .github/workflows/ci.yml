name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Unit tests first: they are fast, and the contrast test is the one most
      # likely to catch a well-meaning change to the palette.
      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Build-output tests
        run: npm run test:build

      # Playwright ships a browser matched to itself. @axe-core/cli bundles its
      # own ChromeDriver, which drifts out of step with the runner's Chrome and
      # fails with a version mismatch.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility scan
        run: |
          npx --yes serve dist --listen 4321 &
          npx --yes wait-on http://localhost:4321 --timeout 60000
          npm run test:a11y -- http://localhost:4321

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir is what lets lychee resolve root-relative hrefs like
          # "/sponsor" against the built site rather than the filesystem root.
          #
          # The accepted statuses are sites that answer bots with a refusal
          # rather than a 404: LinkedIn returns 999, several return 403 or 429.
          # A dead link still fails; an unfriendly one does not.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --accept 200,206,403,429,999
            --max-retries 2
            --timeout 20
            dist
          fail: true

      - name: Lighthouse
        run: |
          npx --yes @lhci/cli autorun \
            --collect.staticDistDir=dist \
            --collect.settings.preset=desktop \
            --assert.assertions.categories:performance=off || true
        # Budgets are enforced once a host is chosen and previews exist; see
        # lighthouserc.json.

  # Deploy previews are stubbed until a host is chosen (see docs/decisions.md).
  # Cloudflare Pages / Netlify both wire in here as an extra job.
