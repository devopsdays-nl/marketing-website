version: 2

updates:
  # The site's own dependencies. Grouped so this produces one pull request a
  # month rather than a steady trickle nobody reviews.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

    ignore:
      # astro check refuses to run under TypeScript 7 ("does not currently
      # support TypeScript 7.0") and exits non-zero, which breaks the typecheck
      # step. Astro's replacement for it, @astrojs/ts-content-mapper, is still
      # experimental. Revisit when that is stable, then drop this.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      dev-tooling:
        patterns:
          - vitest
          - '@vitest/*'
          - playwright
          - '@axe-core/*'
          - typescript
          - tsx

  # Workflow actions. These run with repository permissions, so a known-bad
  # version matters more here than in the site's own dependencies.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
